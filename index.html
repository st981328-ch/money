<body>
<div class="app">
  <div class="topbar">
    <h1 id="pageTitle">記錄</h1>
    <div class="topbar-right">
      <div class="month-nav" id="monthNav">
        <button onclick="shiftMonth(-1)">‹</button>
        <div class="mlabel" id="mlabel"></div>
        <button onclick="shiftMonth(1)">›</button>
      </div>
    </div>
  </div>

  <div class="pages">
    <div class="page active" id="page-records"></div>
    <div class="page" id="page-stats"></div>
    <div class="page" id="page-projects"></div>
    <div class="page" id="page-budgets"></div>
    <div class="page" id="page-settings"></div>
  </div>

  <div class="nav" id="nav">
    <button data-p="stats" onclick="go('stats')"><span class="ni" data-ic="chart-pie"></span>統計</button>
    <button data-p="projects" onclick="go('projects')"><span class="ni" data-ic="folder"></span>專案</button>
    <button class="navadd" id="navAddBtn" onclick="navAdd()">＋</button>
    <button data-p="budgets" onclick="go('budgets')"><span class="ni" data-ic="target"></span>預算</button>
    <button data-p="settings" onclick="go('settings')"><span class="ni" data-ic="settings"></span>設定</button>
  </div>
</div>

<div class="mask" id="mask" onclick="closeTopSheet()"></div>
<div class="toast" id="toast"></div>

<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/sync.js"></script>
<script src="js/main.js"></script>
</body>
</html>
